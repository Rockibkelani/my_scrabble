# Netlify sert le site statique (dossier public/) et relaie /api/* vers le serveur C sur Render.
# Le navigateur ne parle qu'a Netlify : meme origine, donc aucun souci de CORS.

[build]
  publish = "public"

# Ancienne adresse Netlify : tout est renvoye vers le domaine principal (en premier : les regles sont lues dans l'ordre).
[[redirects]]
  from = "https://myscrabblee.netlify.app/*"
  to = "https://myscrabblee.bykelani.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://myscrabblee.netlify.app/*"
  to = "https://myscrabblee.bykelani.dev/:splat"
  status = 301
  force = true

# Anciennes pages (le site est maintenant consacre au Scrabble) : on renvoie vers l'accueil.
[[redirects]]
  from = "/articles.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/"
  status = 301

# Serveur C sur Render : toutes les requetes /api/* lui sont relayees.
[[redirects]]
  from = "/api/*"
  to = "https://cwebsite-api.onrender.com/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
